<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meezan Rent Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        /* Password Screen Styles */
        .login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 400px;
        }

        .password-input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .error-message {
            color: #ff4444;
            margin-top: 10px;
            display: none;
        }

        /* Main Application Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            display: none;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 1.8rem;
        }

        .calculator-body {
            padding: 30px;
        }

        .input-group {
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .input-group label {
            width: 120px;
            font-weight: 500;
            color: #333;
            flex-shrink: 0;
        }

        .input-field {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
            -webkit-appearance: none;
        }

        .input-field:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.3);
        }

        .icon {
            color: #667eea;
            font-size: 20px;
            flex-shrink: 0;
        }

        .result-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin: 25px 0;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .result-item {
            text-align: center;
            padding: 15px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .result-value {
            font-size: 24px;
            font-weight: 600;
            color: #667eea;
            margin-top: 8px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-secondary {
            background: #e9ecef;
            color: #333;
        }

        .history-section {
            margin-top: 30px;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }

        .history-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
        }

        .year-filter {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #yearSelect {
            padding: 8px 12px;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
            background: white;
            cursor: pointer;
            font-size: 14px;
        }

        .history-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            animation: fadeIn 0.5s ease;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .history-item:hover {
            transform: translateX(5px);
        }

        .period-indicator {
            text-align: center;
            margin-bottom: 25px;
            padding: 12px;
            background: #e9ecef;
            border-radius: 8px;
            font-weight: 500;
            color: #666;
        }

        .period-indicator div {
            margin-top: 8px;
            font-weight: 600;
            color: #444;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }

        .modal-input-group {
            margin-bottom: 15px;
        }

        .modal-input-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
        }

        .modal-input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-delete {
            background: #ff4444;
            color: white;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .container {
                margin: 0;
                border-radius: 0;
            }

            .header {
                padding: 25px 20px;
            }

            .calculator-body {
                padding: 20px;
            }

            .input-group {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .input-group label {
                width: auto;
                font-size: 14px;
            }

            .input-field {
                width: 100%;
                font-size: 14px;
                padding: 10px;
            }

            .result-card {
                grid-template-columns: 1fr;
                padding: 15px;
            }

            .result-value {
                font-size: 20px;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                padding: 12px;
                font-size: 14px;
            }

            .history-item {
                padding: 12px;
                font-size: 14px;
            }

            .period-indicator {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- Password Screen -->
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <h2>Meezan Rent Calculator</h2>
            <p>Enter password to access</p>
            <input type="password" class="password-input" id="passwordInput" placeholder="Enter Password">
            <button class="btn btn-primary" onclick="checkPassword()">Unlock</button>
            <div class="error-message" id="errorMessage">Incorrect password!</div>
        </div>
    </div>

    <!-- Main Application -->
    <div class="container" id="mainContainer">
        <div class="header">
            <h1>Meezan Rent Calculator</h1>
            <p>Simplify your shared living expenses</p>
        </div>

        <div class="calculator-body">
            <div class="period-indicator">
                Current Rent Period:<br>
                <div id="rentPeriod"></div>
            </div>

            <div class="input-group">
                <i class="fas fa-home icon"></i>
                <label>Room Rent (₹):</label>
                <input type="number" class="input-field" id="roomRent" value="12000">
            </div>

            <div class="input-group">
                <i class="fas fa-tools icon"></i>
                <label>Maintenance (₹):</label>
                <input type="number" class="input-field" id="maintenance" value="880">
            </div>

            <div class="input-group">
                <i class="fas fa-lightbulb icon"></i>
                <label>Light Bill (₹):</label>
                <input type="number" class="input-field" id="lightBill">
            </div>

            <div class="input-group">
                <i class="fas fa-wifi icon"></i>
                <label>WiFi Bill (₹):</label>
                <input type="number" class="input-field" id="wifi">
            </div>

            <div class="result-card" id="result">
                <div class="result-item">
                    <div>Total Rent</div>
                    <div class="result-value" id="totalRent">₹0.00</div>
                </div>
                <div class="result-item">
                    <div>Per Person</div>
                    <div class="result-value" id="perPerson">₹0.00</div>
                </div>
            </div>

            <div class="button-group">
                <button class="btn btn-primary" onclick="calculateRent()">Calculate</button>
                <button class="btn btn-secondary" onclick="markAsPaid()">Mark as Paid</button>
            </div>

            <div class="history-section">
                <div class="history-header">
                    <div class="history-title">Payment History</div>
                    <div class="year-filter">
                        <label>Filter by Year:</label>
                        <select id="yearSelect" onchange="updateHistory()" class="input-field"></select>
                    </div>
                </div>
                <div id="historyList"></div>
            </div>
        </div>
    </div>

    <!-- History Modal -->
    <div class="modal" id="historyModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <h3>Payment Details</h3>
            <div class="modal-input-group">
                <label>Room Rent (₹):</label>
                <input type="number" class="modal-input" id="modalRoomRent">
            </div>
            <div class="modal-input-group">
                <label>Maintenance (₹):</label>
                <input type="number" class="modal-input" id="modalMaintenance">
            </div>
            <div class="modal-input-group">
                <label>Light Bill (₹):</label>
                <input type="number" class="modal-input" id="modalLightBill">
            </div>
            <div class="modal-input-group">
                <label>WiFi Bill (₹):</label>
                <input type="number" class="modal-input" id="modalWifi">
            </div>
            <div class="modal-actions">
                <button class="btn btn-primary" onclick="updateEntry()">Save Changes</button>
                <button class="btn modal-delete" onclick="deleteEntry()">Delete Record</button>
            </div>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBUR_3jyqDd4EgyT5yPJJfWmG9EyhzmF0g",
            authDomain: "rentdb-f098f.firebaseapp.com",
            projectId: "rentdb-f098f",
            storageBucket: "rentdb-f098f.firebasestorage.app",
            messagingSenderId: "165211578867",
            appId: "1:165211578867:web:49808adb264b449acdf286",
            measurementId: "G-DBNXFPTD75"
        };

        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore(app);
        let unsubscribe = null;

        // Password Protection
        function checkPassword() {
            const password = document.getElementById('passwordInput').value;
            const errorMessage = document.getElementById('errorMessage');
            if(password === 'MeezanRent') {
                localStorage.setItem('authenticated', 'true');
                initApp();
            } else {
                errorMessage.style.display = 'block';
                setTimeout(() => errorMessage.style.display = 'none', 2000);
            }
        }

        function initApp() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainContainer').style.display = 'block';
            setupRealTimeListener();
            initializeYearFilter();
            calculateRent();
        }

        // Real-time Firestore Listener
        function setupRealTimeListener() {
            if(unsubscribe) unsubscribe(); // Clear existing listener
            
            unsubscribe = db.collection('rentHistory')
                .orderBy('timestamp', 'desc')
                .onSnapshot(snapshot => {
                    const payments = [];
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        payments.push({
                            id: doc.id,
                            ...data,
                            date: new Date(data.timestamp?.toDate()).toLocaleDateString('en-IN'),
                            year: new Date(data.timestamp?.toDate()).getFullYear()
                        });
                    });
                    updateYearFilter(payments);
                    updateHistoryUI(payments);
                }, error => {
                    console.error("Firestore error:", error);
                    alert('Error loading payment history!');
                });
        }

        // Year Filter Management
        function initializeYearFilter() {
            const currentYear = new Date().getFullYear();
            document.getElementById('yearSelect').value = currentYear;
        }

        function updateYearFilter(payments) {
            const years = [...new Set(payments.map(p => p.year))].sort((a, b) => b - a);
            const yearSelect = document.getElementById('yearSelect');
            const currentYear = yearSelect.value;
            
            yearSelect.innerHTML = years.map(year => 
                `<option value="${year}" ${year == currentYear ? 'selected' : ''}>${year}</option>`
            ).join('');
        }

        // UI Updates
        function updateHistoryUI(payments) {
            const selectedYear = document.getElementById('yearSelect').value;
            const filtered = payments.filter(p => p.year == selectedYear);
            const historyList = document.getElementById('historyList');
            
            historyList.innerHTML = filtered.map(payment => `
                <div class="history-item" onclick="showDetails('${payment.id}')">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                        <span>${payment.period}</span>
                        <span>${payment.date}</span>
                    </div>
                    <div style="display: flex; justify-content: space-between;">
                        <div>
                            <span style="color: #666;">Total: </span>
                            <strong>₹${calculateTotal(payment).toFixed(2)}</strong>
                        </div>
                        <div>
                            <span style="color: #666;">Per Person: </span>
                            <strong>₹${(calculateTotal(payment) / 6).toFixed(2)}</strong>
                        </div>
                    </div>
                    <div style="text-align: right; margin-top: 8px; color: #4CAF50;">
                        <i class="fas fa-check-circle"></i> Paid
                    </div>
                </div>
            `).join('');
        }

        function calculateTotal(payment) {
            return payment.roomRent + payment.maintenance + payment.lightBill + payment.wifi;
        }

        // Payment Operations
        async function markAsPaid() {
            const period = getCurrentPeriod();
            const paymentData = {
                roomRent: parseFloat(document.getElementById('roomRent').value) || 0,
                maintenance: parseFloat(document.getElementById('maintenance').value) || 0,
                lightBill: parseFloat(document.getElementById('lightBill').value) || 0,
                wifi: parseFloat(document.getElementById('wifi').value) || 0,
                period: period,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                await db.collection('rentHistory').add(paymentData);
                document.getElementById('rentPeriod').textContent = getCurrentPeriod();
                alert('Payment marked successfully!');
            } catch (error) {
                console.error("Error saving payment:", error);
                alert('Error saving payment: ' + error.message);
            }
        }

        // Helper Functions
        function getCurrentPeriod() {
            const now = new Date();
            const start = new Date(now.getFullYear(), now.getMonth(), 10);
            const end = new Date(start.getFullYear(), start.getMonth() + 1, 10);
            return `${formatDate(start)} - ${formatDate(end)}`;
        }

        function formatDate(date) {
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
                          "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            const day = date.getDate();
            const suffix = day === 1 ? 'st' : day === 2 ? 'nd' : day === 3 ? 'rd' : 'th';
            return `${day}${suffix} ${months[date.getMonth()]}`;
        }

        // Initialize app if authenticated
        if(localStorage.getItem('authenticated') === 'true') initApp();
    </script>
</body>
</html>
